name: Publier le blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4

      # Téléchargement AUTHENTIFIÉ via gh (préinstallé sur le runner) : l'endpoint anonyme
      # releases/download rend des 503 sous charge. 3 essais espacés pour le reste.
      - name: Installer Hugo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release download "v${HUGO_VERSION}" --repo gohugoio/hugo \
              --pattern "hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
              --output "${{ runner.temp }}/hugo.deb" && break
            echo "tentative $i échouée, nouvel essai dans ${i}0 s"
            sleep "${i}0"
          done
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - uses: actions/configure-pages@v5
        id: pages

      # --logLevel warn : les LIEN MORT du render hook apparaissent dans les logs du job.
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --logLevel warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

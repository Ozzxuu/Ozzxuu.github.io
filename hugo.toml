baseURL = 'https://ozzxuu.github.io/'
locale = 'fr-fr'
title = 'Ozzxuu'
enableRobotsTXT = true

# La date vient du NOM DE FICHIER (2026-07-28-...) : rien à écrire dans le front matter.
[frontmatter]
  date = ['date', ':filename', 'lastmod']

# L'URL publique vient du champ `slug`, pas du nom de fichier.
# Les liens internes continuent de viser le nom de fichier — c'est le render hook qui traduit.
[permalinks]
  page = '/:slug/'

[markup.goldmark.renderer]
  unsafe = false   # laisse <placeholder> non échappé se faire manger : on veut le savoir

[markup.highlight]
  noClasses = false      # → CSS externe, donc thème clair ET sombre possibles
  lineNumbersInTable = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Notes de terrain : Linux, bas niveau, reverse engineering."

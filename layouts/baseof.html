<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/code.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}">{{ end }}
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    {{/* Absent du build prod tant que le lexique est en draft — pas de lien mort. */}}
    <nav>{{ with .Site.GetPage "/lexique" }}<a href="{{ .RelPermalink }}">Lexique</a>{{ end }}</nav>
  </header>

  <main>{{ block "main" . }}{{ end }}</main>

  <footer class="site">
    <p>{{ .Site.Title }} — <a href="{{ "index.xml" | relURL }}">RSS</a></p>
  </footer>
</body>
</html>

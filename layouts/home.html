{{ define "main" }}
<div class="intro">
  {{ .Content }}
</div>

<ul class="index">
  {{ range where .Site.RegularPages "Params.unlisted" "!=" true }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
